[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aforo"
version = "1.0.0"
description = "Aforo vehicular y estimacion de velocidad con YOLOv8, ByteTrack y SQLite"
readme = "README.md"
requires-python = ">=3.10"
# Las dependencias exactas (versiones probadas) estan en requirements.txt.

[project.scripts]
aforo = "aforo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
